# fly.toml app configuration file generated for phcf-backend on 2026-07-29T22:32:08-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'phcf-backend'
primary_region = 'iad'

[[mounts]]
  source = 'pb_data'
  destination = '/app/pb_data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
